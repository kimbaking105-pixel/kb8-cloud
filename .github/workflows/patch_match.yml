name: patch-match
on:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          python3 -m pip install --quiet --break-system-packages python-chess
          g++ -std=c++17 -O2 -pthread engine_base.cpp -o base
          g++ -std=c++17 -O2 -pthread engine_mdp.cpp -o cand
          chmod +x base cand
      - name: Match shard ${{ matrix.shard }} (50 pairs = 100 games)
        run: |
          mkdir -p results
          python3 run_match.py ./base ./cand 50 8192 200 $((1000 + ${{ matrix.shard }})) results/match_${{ matrix.shard }}.txt
          head -1 results/match_${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: match-${{ matrix.shard }}
          path: results/match_${{ matrix.shard }}.txt

  summary:
    needs: match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: match-*
          path: results
          merge-multiple: true
      - name: Summary
        run: |
          python3 summarize.py
      - uses: actions/upload-artifact@v4
        with:
          name: patch-match-summary
          path: summary.txt
